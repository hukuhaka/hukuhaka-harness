name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install optional tree-sitter (golden ON-mode)
        run: pip install "tree-sitter-language-pack==0.9.1"

      - name: Run validation
        run: scripts/validate.sh

      - name: Check version bump on plugin changes
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: scripts/check-plugin-version-bumps.sh "${{ github.event.pull_request.base.sha }}"
