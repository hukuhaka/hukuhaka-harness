name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches /VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJECT_VERSION=$(head -n1 VERSION | tr -d '[:space:]')
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG does not match /VERSION ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Version verified: $PROJECT_VERSION"

      - name: Run validation
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          profile=public
          if [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
            profile=private
          fi
          scripts/validate.sh --profile "$profile"

      - name: Create private GitHub Release
        if: github.event.repository.private
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  live-install:
    name: Live install (${{ matrix.os }})
    needs: release
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run the documented explicit Claude installer
        shell: bash
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT
          mkdir -p "$smoke_root/bin" "$smoke_root/home"
          cat > "$smoke_root/bin/claude" <<'SH'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then
              echo "claude release smoke"
          elif [ "${1:-}" = "plugin" ] && [ "${2:-}" = "list" ] && [ "${3:-}" = "--json" ]; then
              config_dir="${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
              python3 - "$config_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          installed_path = root / "plugins" / "installed_plugins.json"
          settings_path = root / "settings.json"
          installed = json.loads(installed_path.read_text()) if installed_path.is_file() else {"plugins": {}}
          settings = json.loads(settings_path.read_text()) if settings_path.is_file() else {}
          enabled = settings.get("enabledPlugins", {})
          plugins = []
          for plugin_id, entries in installed.get("plugins", {}).items():
              if not isinstance(entries, list) or not entries:
                  continue
              item = dict(entries[0])
              item.update({"id": plugin_id, "enabled": enabled.get(plugin_id) is True})
              plugins.append(item)
          print(json.dumps(plugins))
          PY
          fi
          exit 0
          SH
          chmod +x "$smoke_root/bin/claude"
          export HOME="$smoke_root/home"
          export PATH="$smoke_root/bin:$PATH"
          expected_version="${GITHUB_REF_NAME#v}"
          output=$(curl -fsSL "https://raw.githubusercontent.com/hukuhaka/hukuhaka-harness/${GITHUB_REF_NAME}/scripts/install.sh" \
            | /bin/bash -s -- --version "$expected_version" claude install --recommended --yes 2>&1)
          printf '%s\n' "$output"
          grep -Fq "Downloading hukuhaka-harness v${expected_version}..." <<<"$output"
          grep -Fq "  Claude Code: success" <<<"$output"
          grep -Fq "Run /reload-plugins" <<<"$output"
          ! grep -Fq "unbound variable" <<<"$output"
          python3 - "$HOME/.claude/.hukuhaka-manifest.json" "$expected_version" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("version") != sys.argv[2]:
              raise SystemExit(
                  "manifest version {!r} != {!r}".format(
                      manifest.get("version"), sys.argv[2]
                  )
              )
          PY

  publish-release:
    name: Publish GitHub Release
    needs: [release, live-install]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
